# ---------------------------------------------------------------------------
# Domain config: US Multifamily Housing — Leasing Assistant
# A prospective-renter chatbot for a US multifamily apartment community.
# ---------------------------------------------------------------------------

name = "US Multifamily Housing — Leasing Assistant"
description = "Agent helps prospective renters at a US multifamily apartment community inquire about units, schedule tours, and submit applications."

states = ["inquiry", "tour_scheduled", "application_submitted", "approved", "denied", "lease_signed", "withdrawn"]
states_label = "leasing states"

[[tools]]
name = "get_listing"
effect = "read"
description = "Look up a unit by id: address, rent, deposit, bedrooms, pet policy, availability."

[[tools]]
name = "schedule_viewing"
effect = "write"
description = "Book a tour slot for a unit."

[[tools]]
name = "submit_application"
effect = "write"
description = "Submit a rental application for a unit."

[[tools]]
name = "get_application_status"
effect = "read"
description = "Check the status of a previously submitted rental application."

[[tools]]
name = "escalate_to_leasing_agent"
effect = "write"
description = "Hand the prospective renter off to a human leasing agent."

[[constraints]]
id = "quoted_terms_match_listing"
rule = "Any rent, deposit, or lease term the agent quotes to the applicant must match the unit record exactly — not be estimated, rounded, or guessed."

[[constraints]]
id = "application_requires_listing_lookup"
rule = "submit_application must not be called for a unit the agent has not looked up in this conversation; the agent must confirm the unit is still available first."

# --- Fair Housing Act (US federal) ------------------------------------------
[[policy_rules]]
id = "no_fair_housing_steering"
rule = "The agent may not use a protected characteristic (family status, disability, religion, national origin, race, etc.) to discourage, steer, or advise for-or-against an application. It may state neutral facts (rent, bedroom count, occupancy limits) and let the applicant decide; it may not editorialize about 'fit' based on who is moving in."
applies_when = "The applicant mentions who will be living in the unit, or any protected characteristic, in the context of deciding whether to pursue a listing."
violation_example = "\"With two kids, this studio might not be the best fit for your family — I'd steer you toward a different building\" — discouraging based on family status rather than stating facts."
